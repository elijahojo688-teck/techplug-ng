<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>TECHPLUGIST | Digital Technology Solutions</title>

<meta
  name="description"
  content="TECHPLUGIST builds modern websites and digital technology solutions for businesses, creators and organizations.">

<meta
  name="keywords"
  content="TECHPLUGIST, websites, technology, digital solutions, web design, Nigeria">

<meta name="author" content="Ojo Elijah">

<meta name="theme-color" content="#050912">

<style>

/* =====================================================
   TECHPLUGIST
   MODERN DIGITAL TECHNOLOGY WEBSITE
===================================================== */

:root{
  --bg:#050912;
  --bg2:#08111e;
  --card:#0b1726;
  --card2:#0e1c2e;
  --blue:#29a9ff;
  --blue2:#72d8ff;
  --white:#ffffff;
  --text:#dbe7f2;
  --muted:#8ea2b6;
  --border:#1b3045;
  --success:#38d39f;
  --shadow:0 20px 60px rgba(0,0,0,.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    Segoe UI,
    Arial,
    Helvetica,
    sans-serif;
  background:var(--bg);
  color:var(--white);
  line-height:1.6;
  overflow-x:hidden;
}

body.modal-open{
  overflow:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =====================================================
   SCROLL PROGRESS
===================================================== */

.progress{
  position:fixed;
  top:0;
  left:0;
  width:0;
  height:3px;
  background:var(--blue);
  z-index:10000;
}

/* =====================================================
   LOADER
===================================================== */

#loader{
  position:fixed;
  inset:0;
  background:#040810;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:99999;
  transition:.7s ease;
}

#loader.hide{
  opacity:0;
  visibility:hidden;
}

.loader-logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:3px;
}

.loader-logo span{
  color:var(--blue);
}

.loader-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:8px;
  letter-spacing:2px;
}

.loader-line{
  width:190px;
  height:3px;
  background:#172638;
  border-radius:20px;
  overflow:hidden;
  margin-top:22px;
}

.loader-line span{
  display:block;
  width:0;
  height:100%;
  background:var(--blue);
  animation:loading 2s forwards;
}

@keyframes loading{
  to{
    width:100%;
  }
}

/* =====================================================
   NAVIGATION
===================================================== */

.navbar{
  position:fixed;
  top:3px;
  left:0;
  width:100%;
  height:72px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(5,9,18,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07);
  z-index:5000;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:var(--blue);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:24px;
}

.nav-links a{
  color:#b9c8d7;
  font-size:14px;
  transition:.25s;
}

.nav-links a:hover{
  color:var(--blue);
}

.nav-cta{
  background:var(--blue);
  color:#00111d !important;
  padding:10px 17px;
  border-radius:8px;
  font-weight:800;
}

.menu-btn{
  display:none;
  border:0;
  background:none;
  color:white;
  font-size:28px;
}

/* =====================================================
   GENERAL
===================================================== */

section{
  padding:105px 6%;
}

.container{
  max-width:1150px;
  margin:auto;
}

.label{
  color:var(--blue);
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
}

.title{
  font-size:clamp(34px,5vw,58px);
  line-height:1.08;
  letter-spacing:-2px;
  margin:10px 0 18px;
}

.description{
  color:var(--muted);
  max-width:680px;
}

.center{
  text-align:center;
}

.center .description{
  margin:auto;
}

/* =====================================================
   BUTTONS
===================================================== */

.buttons{
  display:flex;
  gap:13px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:14px 22px;
  border-radius:9px;
  font-weight:800;
  border:1px solid transparent;
  transition:.3s;
}

.btn-primary{
  background:var(--blue);
  color:#00101b;
}

.btn-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 35px rgba(41,169,255,.2);
}

.btn-outline{
  background:#0a1726;
  border-color:#294056;
  color:white;
}

.btn-outline:hover{
  border-color:var(--blue);
}

.btn-small{
  padding:10px 15px;
  font-size:13px;
}

/* =====================================================
   HERO
===================================================== */

.hero{
  min-height:100vh;
  padding-top:150px;
  padding-bottom:100px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:550px;
  height:550px;
  right:-230px;
  top:80px;
  border-radius:50%;
  background:var(--blue);
  opacity:.07;
  filter:blur(100px);
}

.hero::after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  left:-150px;
  bottom:0;
  border-radius:50%;
  background:#246bff;
  opacity:.05;
  filter:blur(90px);
}

.hero-content{
  max-width:900px;
  position:relative;
  z-index:2;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border:1px solid #214a66;
  background:#091b2b;
  color:#63ccff;
  border-radius:30px;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:24px;
}

.badge-dot{
  width:7px;
  height:7px;
  background:var(--success);
  border-radius:50%;
}

.hero h1{
  font-size:clamp(48px,8vw,88px);
  line-height:.98;
  letter-spacing:-5px;
  margin-bottom:25px;
}

.hero h1 span{
  color:var(--blue);
}

.hero-text{
  max-width:700px;
  color:var(--muted);
  font-size:18px;
  margin-bottom:32px;
}

.hero-note{
  margin-top:20px;
  color:#647a8e;
  font-size:12px;
}

/* =====================================================
   STATS
===================================================== */

.stats{
  background:#07111e;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.stats-grid{
  max-width:1150px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.stat{
  padding:30px 15px;
  text-align:center;
  border-right:1px solid var(--border);
}

.stat:last-child{
  border-right:0;
}

.stat strong{
  display:block;
  font-size:30px;
  color:white;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

/* =====================================================
   ABOUT
===================================================== */

.about{
  background:#070e19;
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:55px;
  align-items:center;
}

.about-card{
  background:
    linear-gradient(
      145deg,
      #0e1e30,
      #08111d
    );
  border:1px solid var(--border);
  border-radius:20px;
  padding:35px;
  box-shadow:var(--shadow);
}

.profile{
  display:flex;
  align-items:center;
  gap:17px;
  margin-bottom:25px;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      135deg,
      #168cd6,
      #6bd8ff
    );
  color:#00111c;
  font-weight:900;
  font-size:20px;
}

.profile h3{
  font-size:20px;
}

.profile span{
  color:var(--blue2);
  font-size:12px;
}

.about-card p{
  color:var(--muted);
}

.check{
  display:flex;
  gap:10px;
  margin-top:13px;
  color:#c6d4e0;
}

.check b{
  color:var(--blue);
}

/* =====================================================
   WHY US
===================================================== */

.why-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:50px;
}

.why-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:30px;
}

.why-icon{
  font-size:25px;
  margin-bottom:20px;
}

.why-card h3{
  margin-bottom:10px;
}

.why-card p{
  color:var(--muted);
  font-size:14px;
}

/* =====================================================
   SERVICES
===================================================== */

.services{
  background:#050b14;
}

.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:50px;
}

.service{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:30px;
  transition:.3s;
}

.service:hover{
  transform:translateY(-6px);
  border-color:#27739d;
}

.service-icon{
  width:50px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:#0c273d;
  color:var(--blue);
  font-size:22px;
  margin-bottom:20px;
}

.service h3{
  margin-bottom:9px;
}

.service p{
  color:var(--muted);
  font-size:14px;
}

.learn{
  margin-top:18px;
  background:none;
  border:0;
  color:var(--blue);
  font-weight:800;
}

/* =====================================================
   TECHNOLOGY
===================================================== */

.tech{
  background:#070e19;
}

.tech-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.tech-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin-top:30px;
}

.tech-item{
  background:#0b1726;
  border:1px solid var(--border);
  padding:16px;
  border-radius:10px;
  color:#c7d5e1;
}

.tech-item span{
  color:var(--blue);
  margin-right:8px;
}

/* =====================================================
   PROCESS
===================================================== */

.process{
  background:#050b14;
}

.process-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-top:50px;
}

.step{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:25px;
}

.number{
  color:var(--blue);
  font-size:28px;
  font-weight:900;
}

.step h3{
  margin:10px 0;
}

.step p{
  color:var(--muted);
  font-size:14px;
}

/* =====================================================
   PROJECTS
===================================================== */

.projects-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:50px;
}

.project{
  min-height:245px;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  border-radius:18px;
  border:1px solid var(--border);
  background:
    linear-gradient(
      145deg,
      #112b43,
      #08111d
    );
  transition:.3s;
}

.project:hover{
  transform:translateY(-5px);
  border-color:#27739d;
}

.project small{
  color:var(--blue);
  font-weight:900;
}

.project h3{
  font-size:23px;
  margin:5px 0;
}

.project p{
  color:var(--muted);
  font-size:13px;
}

/* =====================================================
   TESTIMONIALS
===================================================== */

.testimonials{
  background:#070e19;
}

.testimonial-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:50px;
}

.testimonial{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:30px;
}

.stars{
  color:#63caff;
  letter-spacing:3px;
  margin-bottom:18px;
}

.testimonial p{
  color:#a9bac9;
  font-size:14px;
}

.person{
  margin-top:22px;
  color:white;
  font-weight:800;
}

.person span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:normal;
}

/* =====================================================
   PRICING
===================================================== */

.pricing{
  background:#050b14;
}

.pricing-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:50px;
}

.price-card{
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:30px;
}

.price-card.featured{
  border-color:var(--blue);
  transform:translateY(-8px);
}

.popular{
  position:absolute;
  top:15px;
  right:15px;
  padding:5px 9px;
  border-radius:20px;
  background:var(--blue);
  color:#00111c;
  font-size:9px;
  font-weight:900;
}

.price{
  font-size:40px;
  font-weight:900;
  margin:14px 0;
}

.price-card p{
  color:var(--muted);
}

.price-card ul{
  list-style:none;
  margin:22px 0;
}

.price-card li{
  margin:10px 0;
  color:#c4d2df;
}

/* =====================================================
   FAQ
===================================================== */

.faq-list{
  max-width:850px;
  margin:50px auto 0;
}

details{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:19px 20px;
  margin-bottom:12px;
}

summary{
  cursor:pointer;
  font-weight:800;
}

details p{
  color:var(--muted);
  padding-top:14px;
  font-size:14px;
}

/* =====================================================
   CONTACT
===================================================== */

.contact{
  background:#070e19;
}

.contact-grid{
  display:grid;
  grid-template-columns:.85fr 1.15fr;
  gap:30px;
  margin-top:50px;
}

.contact-card,
.form{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:30px;
}

.contact-item{
  padding:18px 0;
  border-bottom:1px solid var(--border);
}

.contact-item:last-child{
  border-bottom:0;
}

.contact-item small{
  display:block;
  color:var(--blue);
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:4px;
}

.contact-item span{
  color:#c6d4df;
}

.form-group{
  margin-bottom:17px;
}

.form label{
  display:block;
  color:#cbd8e3;
  font-size:13px;
  margin-bottom:7px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  padding:13px;
  background:#07111d;
  color:white;
  border:1px solid #20374d;
  border-radius:9px;
  outline:none;
}

.form input:focus,
.form textarea:focus,
.form select:focus{
  border-color:var(--blue);
}

.form textarea{
  min-height:130px;
  resize:vertical;
}

/* =====================================================
   CTA
===================================================== */

.cta{
  padding-top:70px;
  padding-bottom:70px;
}

.cta-box{
  max-width:1100px;
  margin:auto;
  text-align:center;
  padding:65px 30px;
  border:1px solid #1f5474;
  border-radius:25px;
  background:
    linear-gradient(
      135deg,
      #0d2942,
      #08121e
    );
}

.cta-box .description{
  margin:0 auto 25px;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
  background:#03070d;
  border-top:1px solid var(--border);
  padding:60px 6% 25px;
}

.footer-grid{
  max-width:1150px;
  margin:auto;
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:40px;
}

.footer-logo{
  font-size:22px;
  font-weight:900;
}

.footer-logo span{
  color:var(--blue);
}

footer p{
  color:#718498;
  max-width:450px;
  margin-top:14px;
}

footer h4{
  margin-bottom:15px;
}

footer a{
  display:block;
  color:#8497aa;
  margin:8px 0;
  font-size:14px;
}

footer a:hover{
  color:var(--blue);
}

.copyright{
  max-width:1150px;
  margin:40px auto 0;
  padding-top:20px;
  border-top:1px solid var(--border);
  color:#607285;
  font-size:12px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:540px;
  background:#0b1726;
  border:1px solid #28445c;
  border-radius:18px;
  padding:30px;
  position:relative;
}

.close{
  position:absolute;
  right:17px;
  top:10px;
  border:0;
  background:none;
  color:white;
  font-size:28px;
}

.modal-box p{
  color:var(--muted);
  margin:15px 0 25px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  background:#102333;
  border:1px solid #28506a;
  color:white;
  padding:13px 18px;
  border-radius:10px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:10000;
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =====================================================
   BACK TO TOP
===================================================== */

.top-btn{
  position:fixed;
  right:20px;
  bottom:20px;
  width:43px;
  height:43px;
  border-radius:50%;
  border:1px solid #29475f;
  background:#0b1a29;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
}

.top-btn.show{
  display:flex;
}

/* =====================================================
   REVEAL ANIMATION
===================================================== */

.reveal{
  opacity:0;
  transform:translateY(25px);
  transition:.7s ease;
}

.reveal.visible{
  opacity:1;
  transform:translateY(0);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

  .nav-links{
    display:none;
    position:absolute;
    top:72px;
    left:5%;
    width:90%;
    padding:15px;
    background:#091522;
    border:1px solid var(--border);
    border-radius:12px;
    flex-direction:column;
    align-items:stretch;
  }

  .nav-links.show{
    display:flex;
  }

  .nav-links a{
    padding:11px;
  }

  .menu-btn{
    display:block;
  }

  .about-grid,
  .tech-grid,
  .contact-grid{
    grid-template-columns:1fr;
  }

  .services-grid,
  .projects-grid,
  .pricing-grid,
  .testimonial-grid{
    grid-template-columns:1fr;
  }

  .why-grid{
    grid-template-columns:1fr;
  }

  .process-grid{
    grid-template-columns:1fr 1fr;
  }

  .price-card.featured{
    transform:none;
  }

  .footer-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  section{
    padding:78px 5%;
  }

  .navbar{
    padding:0 5%;
  }

  .hero{
    padding-top:130px;
  }

  .hero h1{
    font-size:49px;
    letter-spacing:-3px;
  }

  .hero-text{
    font-size:16px;
  }

  .buttons{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

  .stats-grid{
    grid-template-columns:1fr 1fr;
  }

  .stat{
    border-bottom:1px solid var(--border);
  }

  .process-grid{
    grid-template-columns:1fr;
  }

  .tech-list{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<!-- SCROLL PROGRESS -->
<div class="progress" id="progress"></div>

<!-- LOADER -->
<div id="loader">

  <div class="loader-logo">
    TECH<span>PLUGIST</span>
  </div>

  <div class="loader-sub">
    DIGITAL TECHNOLOGY
  </div>

  <div class="loader-line">
    <span></span>
  </div>

</div>

<!-- NAVIGATION -->
<header class="navbar">

  <a href="#home" class="logo">
    TECH<span>PLUGIST</span>
  </a>

  <button
    class="menu-btn"
    onclick="toggleMenu()"
    aria-label="Open navigation">
    ☰
